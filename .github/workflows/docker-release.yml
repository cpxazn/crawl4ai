name: Publish Docker Image

# Deterministic run name: it is how the sync workflow recognises an in-flight
# publication for a given tag, so a retry waits for the existing run instead of
# dispatching a second one.
run-name: docker ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

permissions:
  contents: read

on:
  release:
    types: [published]
  push:
    tags:
      - 'docker-rebuild-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. sync-<sha>); used as the image version"
        type: string
        required: false
      ref:
        description: "Commit SHA to build"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  # Queue, never cancel: cancelling a multi-arch push mid-flight leaves a half-published tag.
  cancel-in-progress: false

env:
  PLATFORMS: linux/amd64,linux/arm64
  IMAGE_NAME: cpxazn/crawl4ai

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve the checked-out revision
        id: rev
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          echo "sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "building from ${head_sha}"

      - name: Verify the requested revision was checked out
        if: inputs.ref != ''
        env:
          INPUT_REF: ${{ inputs.ref }}
          HEAD_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          echo "checked out ${HEAD_SHA} (requested ${INPUT_REF})"
          if [ "${HEAD_SHA}" != "${INPUT_REF}" ]; then
            echo "::error::checked out ${HEAD_SHA}, expected the requested ${INPUT_REF}; refusing to publish this image."
            exit 1
          fi

      - name: Extract version from release or rebuild tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=""
          publish_latest="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            version="${{ inputs.tag }}"
            version="${version#v}"
            if [[ "${version}" != *-* ]]; then
              publish_latest="true"
            fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
            if [ "${{ github.event.release.prerelease }}" != "true" ]; then
              publish_latest="true"
            fi
          elif [[ "${GITHUB_REF_NAME}" == docker-rebuild-v* ]]; then
            version="${GITHUB_REF_NAME#docker-rebuild-v}"
            if [[ "${version}" != *-* ]]; then
              publish_latest="true"
            fi
          fi

          if [ -n "${version}" ]; then
            major="${version%%.*}"
            rest="${version#"${major}".}"
            if [ "${rest}" != "${version}" ]; then
              minor_component="${rest%%.*}"
              major_minor="${major}.${minor_component}"
            else
              major_minor=""
            fi
            {
              echo "has_version=true"
              echo "version=${version}"
              echo "major=${major}"
              echo "major_minor=${major_minor}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
          fi

          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"


      - name: Recheck publication state before building
        id: published
        if: startsWith(steps.version.outputs.version, 'sync-')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Serialised by the concurrency group, but serialisation is not idempotence: a
          # queued duplicate must not rebuild a tag that a previous run already pushed.
          # Only an explicit 404 means "not published"; anything else fails loudly.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}" || echo 000)"
          case "${code}" in
            200)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "${IMAGE_NAME}:${VERSION} is already published; skipping the build."
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "${IMAGE_NAME}:${VERSION} is not published yet; building."
              ;;
            *)
              echo "::error::registry lookup for ${IMAGE_NAME}:${VERSION} returned ${code}; refusing to guess."
              exit 1
              ;;
          esac


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.has_version == 'true' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.major_minor != '' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.major != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_latest == 'true' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        id: build
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          build-args: |
            GIT_COMMIT=${{ steps.rev.outputs.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what this run published
        if: always()
        env:
          REV: ${{ steps.rev.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          SKIPPED: ${{ steps.published.outputs.skip }}
        run: |
          set -euo pipefail

          action="built"
          digest="${DIGEST}"
          if [ "${SKIPPED:-false}" = "true" ] || [ -z "${digest}" ]; then
            # A skipped build has no build-push digest. Report the digest that is actually
            # published for this version, and say so, instead of emitting "none" and making
            # the consumer reject a perfectly valid image.
            action="reused"
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}" || echo 000)"
            if [ "${code}" != "200" ]; then
              echo "::error::skipped the build, but ${IMAGE_NAME}:${VERSION} is not published (HTTP ${code})."
              exit 1
            fi
            digest="$(curl -s --max-time 20 \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}" \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("digest") or ((d.get("images") or [{}])[0]).get("digest") or "")')"
            if [ -z "${digest}" ]; then
              echo "::error::could not read the published digest for ${VERSION}"
              exit 1
            fi
          fi

          # Machine-readable markers: the sync workflow reads them back from this run's log
          # to tie the published digest to the publisher it selected, instead of comparing a
          # tag against itself.
          echo "::notice::published-action=${action}"
          echo "::notice::published-revision=${REV:-unknown}"
          echo "::notice::published-digest=${digest}"
          echo "published-action=${action}"
          echo "published-revision=${REV:-unknown}"
          echo "published-digest=${digest}"
          echo "published-version=${VERSION:-unknown}"
