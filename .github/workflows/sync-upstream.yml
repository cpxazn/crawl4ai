name: Sync Upstream

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only: never push, tag, release or dispatch"
        type: boolean
        default: false
      sync_branch:
        description: "Branch to merge into and push"
        type: string
        default: main
      build_image:
        description: "Deprecated: image validation always runs now. Kept so old invocations do not fail."
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/unclecode/crawl4ai.git
  UPSTREAM_BRANCH: main
  IMAGE_NAME: cpxazn/crawl4ai

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout the sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sync_branch || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Configure git
        env:
          SYNC_BRANCH: ${{ inputs.sync_branch || 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local advice.detachedHead false
          echo "SYNC_BRANCH=${SYNC_BRANCH}" >> "$GITHUB_ENV"

      - name: Fetch origin and upstream
        run: |
          set -euo pipefail
          git remote set-url upstream "${UPSTREAM_REPO}" 2>/dev/null || git remote add upstream "${UPSTREAM_REPO}"
          git fetch --prune origin
          git fetch --prune upstream "${UPSTREAM_BRANCH}"

      - name: Align HEAD with the fetched branch tip
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "origin/${SYNC_BRANCH}" > /dev/null; then
            git checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"
          else
            echo "::error::origin/${SYNC_BRANCH} does not exist; refusing to invent a branch."
            exit 1
          fi

      - name: Detect upstream changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_ref="upstream/${UPSTREAM_BRANCH}"
          target_ref="origin/${SYNC_BRANCH}"
          merge_base="$(git merge-base "${target_ref}" "${upstream_ref}")"
          upstream_sha="$(git rev-parse "${upstream_ref}")"
          target_sha="$(git rev-parse "${target_ref}")"
          ahead="$(git rev-list --count "${merge_base}..${upstream_ref}")"
          tag="sync-${upstream_sha}"

          # Publication state is resolved here, before any validation, so a run that
          # finds nothing new to merge but a missing tag/release still validates the
          # tree before publishing instead of skipping every gate.
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')" ]; then
            tag_exists=true
          else
            tag_exists=false
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi

          # Docker publication is tracked independently of the release: a run that dies after
          # creating the release but before the image dispatch must be able to retry just the
          # image. The image tag is the sync tag itself (docker-release derives the version
          # from `-f tag`), so the registry answers "is this published yet?". Only an explicit
          # 404 means "absent": timeouts, rate limits and 5xx must fail the run instead of
          # silently triggering another publication.
          hub_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}" || echo 000)"
          case "${hub_code}" in
            200) image_exists=true ;;
            404) image_exists=false ;;
            *) echo "::error::Docker Hub lookup for ${IMAGE_NAME}:${tag} returned ${hub_code}; refusing to guess whether the image exists."
               exit 1 ;;
          esac

          {
            echo "merge_base=${merge_base}"
            echo "upstream_sha=${upstream_sha}"
            echo "target_sha=${target_sha}"
            echo "upstream_ahead_count=${ahead}"
            echo "tag=${tag}"
            echo "tag_exists=${tag_exists}"
            echo "release_exists=${release_exists}"
            echo "image_exists=${image_exists}"
            if [ "${ahead}" = "0" ]; then echo "has_changes=false"; else echo "has_changes=true"; fi
          } >> "$GITHUB_OUTPUT"

          echo "Upstream ${upstream_sha} is ${ahead} commit(s) ahead of the merge base." \
            "Target branch is at ${target_sha}." \
            "tag_exists=${tag_exists} release_exists=${release_exists} image_exists=${image_exists}."

      - name: Merge upstream into the sync branch
        id: merge
        if: steps.detect.outputs.has_changes == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          # No auto-resolution. Every file upstream touches here is hand-written
          # source, and guessing semantics inside a conflict is exactly how a fork
          # silently loses its own behaviour. Any conflict at all aborts the run and
          # nothing is pushed, tagged or released.

          if ! git merge --no-ff --no-commit "upstream/${UPSTREAM_BRANCH}"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            git merge --abort || true
            {
              echo "## Upstream sync blocked by merge conflicts"
              echo ""
              echo "Upstream: \`${UPSTREAM_SHA}\`"
              echo ""
              echo "Nothing was pushed, tagged or released. Resolve these by hand on the"
              echo "fork, then re-run this workflow:"
              echo ""
              for conflict in "${conflicts[@]}"; do
                # 140 is a backtick; writing it literally inside quotes trips shellcheck SC2016.
                printf -- '- \140%s\140\n' "${conflict}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::merge conflicted on ${#conflicts[@]} path(s); see the job summary. Nothing was pushed."
            exit 1
          fi

          if git diff --cached --quiet && git diff --quiet; then
            echo "::error::the merge produced no changes despite upstream being ahead."
            exit 1
          fi

          git commit -m "merge: upstream ${UPSTREAM_SHA}" \
                     -m "Automated sync of ${UPSTREAM_REPO} ${UPSTREAM_BRANCH}."
          echo "merge_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether validation is required
        id: plan
        run: |
          set -euo pipefail
          # Validation runs for anything that will publish, and for every dry run.
          # A run with nothing new to merge but a missing tag or release still has to
          # validate the tree before publishing, so this is not just "has_changes".
          if [ "${{ steps.detect.outputs.has_changes }}" = "true" ] \
             || [ "${{ inputs.dry_run }}" = "true" ] \
             || [ "${{ steps.detect.outputs.tag_exists }}" = "false" ] \
             || [ "${{ steps.detect.outputs.release_exists }}" = "false" ] \
             || [ "${{ steps.detect.outputs.image_exists }}" = "false" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.build_needed == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .
          python -m pip install --quiet -r deploy/docker/requirements.txt
          python -m pip install --quiet pytest pyjwt pytest-asyncio "pydantic[email]" build pyyaml

      - name: Compile and import the Docker server
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          python -m compileall -q deploy/docker
          ( cd deploy/docker && python -c "import server; print('server import ok:', type(server.app).__name__)" )

      - name: Build the wheel and sdist
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          python -m build
          ls -l dist

      - name: "Behavioural gate: docker server test suites"
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          # test_monitor_demo.py expects a live server and fails identically on fork and
          # upstream today; it is the only exclusion. test_1..test_7 drive a running
          # container with curl-style scripts and are not pytest suites.
          pytest deploy/docker/tests -q -p no:cacheprovider -o asyncio_mode=auto \
            --ignore=deploy/docker/tests/test_monitor_demo.py \
            --ignore=deploy/docker/tests/test_1_basic.py \
            --ignore=deploy/docker/tests/test_2_memory.py \
            --ignore=deploy/docker/tests/test_3_pool.py \
            --ignore=deploy/docker/tests/test_4_concurrent.py \
            --ignore=deploy/docker/tests/test_5_pool_stress.py \
            --ignore=deploy/docker/tests/test_6_multi_endpoint.py \
            --ignore=deploy/docker/tests/test_7_cleanup.py

      - name: Workflow logic harnesses
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          # The merge policy and the publication decisions are shell logic, so they are
          # covered by harnesses that run the real step bodies against synthetic
          # repositories and fake gh/curl/docker. The structure check rejects duplicate
          # keys and steps that lost their run:/uses:.
          python .github/harness/test_workflow_structure.py
          python .github/harness/test_merge_step.py .github/workflows/sync-upstream.yml
          python .github/harness/test_publish_step.py .github/workflows/sync-upstream.yml .github/workflows/docker-release.yml

      - name: Lint the workflows with actionlint
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:latest .github/workflows/sync-upstream.yml .github/workflows/docker-release.yml

      - name: Build the published image
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t crawl4ai-sync:validate . 2>&1 | tail -25

      - name: Assert the image installed this tree and enforces its auth posture
        if: steps.plan.outputs.build_needed == 'true'
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          installed="$(docker run --rm --entrypoint python3 crawl4ai-sync:validate -c 'import crawl4ai,os;print(os.path.realpath(crawl4ai.__file__))')"
          echo "image installed crawl4ai from: ${installed}"

          # Provenance. `crawl4ai.__file__` is site-packages whether the image installed this
          # checkout or a downloaded release, and one matching file proves nothing (a different
          # release can share __init__.py). Hash every .py in the package plus the deployed
          # server/filter files this fork actually changed.
          manifest="$(python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path("crawl4ai")
          for path in sorted(root.rglob("*.py")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{path.relative_to(root).as_posix()} {digest}")
          PY
          )"
          manifest_files="$(printf '%s\n' "${manifest}" | wc -l | tr -d ' ')"
          echo "checkout package files: ${manifest_files}"

          verify_manifest() {  # verify_manifest <manifest> <expected-count>
            docker run --rm -i --entrypoint python3 \
              -e EXPECTED_MANIFEST="$1" -e EXPECTED_COUNT="$2" \
              crawl4ai-sync:validate - <<'PY'
          import hashlib, os, pathlib, sys
          import crawl4ai

          package = pathlib.Path(crawl4ai.__file__).resolve().parent
          expected = {}
          for line in os.environ["EXPECTED_MANIFEST"].splitlines():
              if line.strip():
                  rel, digest = line.split(" ", 1)
                  expected[rel] = digest
          want = int(os.environ["EXPECTED_COUNT"])
          missing = [rel for rel in expected if not (package / rel).is_file()]
          mismatched = [
              rel for rel, digest in expected.items()
              if (package / rel).is_file()
              and hashlib.sha256((package / rel).read_bytes()).hexdigest() != digest
          ]
          print(f"package={package} files_in_manifest={len(expected)} expected={want}")
          if missing:
              print("missing:", ", ".join(missing[:10]))
          if mismatched:
              print("mismatched:", ", ".join(mismatched[:10]))
          sys.exit(0 if not missing and not mismatched and len(expected) == want else 1)
          PY
          }

          verify_manifest "${manifest}" "${manifest_files}" \
            || fail "the image does not contain this checkout (package manifest mismatch)"
          echo "package manifest verified inside the image"

          # Negative self-test: perturb a non-__init__ entry and require the check to fail.
          # Without this, a manifest comparison that silently compares nothing looks green.
          victim="$(printf '%s\n' "${manifest}" | grep -v '^__init__\.py ' | head -1 | awk '{print $1}')"
          [ -n "${victim}" ] || fail "could not pick a non-__init__ file for the manifest self-test"
          tampered="$(printf '%s\n' "${manifest}" | awk -v v="${victim}" '$1==v{$2="deadbeef"}1')"
          if verify_manifest "${tampered}" "${manifest_files}" > /dev/null 2>&1; then
            fail "the package manifest check cannot fail (tampered ${victim} still matched)"
          fi
          echo "package manifest self-test verified: a changed ${victim} fails"

          # Runtime files, not the staging copy. supervisord runs gunicorn with `directory=/app`
          # and `server:app`, and the Dockerfile copies deploy/docker/* into /app, so these are
          # the files that actually execute. Hashing /tmp/project would only prove the build
          # input was copied into the image.
          docker run --rm --entrypoint python3 crawl4ai-sync:validate -c \
            "import sys,pathlib; p=pathlib.Path('/app/supervisord.conf'); \
             txt=p.read_text(); sys.exit(0 if ('server:app' in txt and 'directory=/app' in txt) else 1)" \
            || fail "the runtime supervisor config does not launch server:app from /app"
          echo "runtime entrypoint confirmed: gunicorn server:app with directory=/app"

          for pair in "server.py:deploy/docker/server.py" \
                      "api.py:deploy/docker/api.py" \
                      "fork_field_filter.py:deploy/docker/fork_field_filter.py" \
                      "schemas.py:deploy/docker/schemas.py"; do
            runtime="/app/${pair%%:*}"
            rel="${pair#*:}"
            in_image="$(docker run --rm --entrypoint python3 crawl4ai-sync:validate \
              -c "import hashlib;print(hashlib.sha256(open('${runtime}','rb').read()).hexdigest())")" \
              || fail "${runtime} is missing from the image"
            in_repo="$(python3 -c "import hashlib,pathlib;print(hashlib.sha256(pathlib.Path('${rel}').read_bytes()).hexdigest())")"
            echo "${runtime} vs ${rel} sha256 image=${in_image} repo=${in_repo}"
            [ "${in_image}" = "${in_repo}" ] || fail "${runtime} does not match ${rel} in this checkout"
          done
          echo "runtime server files verified inside the image"

          # Assertions run inside the container so a shell compare can never fail on
          # formatting: each check prints what it saw and exits non-zero on a mismatch.
          # `-i` is required: without it docker does not forward the heredoc on stdin and
          # python runs an empty program, which exits 0 and makes the whole gate a no-op.
          check() {  # check <container> <path> <method> <expected>
            docker exec -i "$1" python3 - "$2" "$3" "$4" <<'CHK'
          import sys, json, urllib.request, urllib.error
          path, method, want = sys.argv[1], sys.argv[2], int(sys.argv[3])
          # A body that satisfies the request model, so a POST is judged on auth and not on
          # 422 validation errors (POST /token validates its body before refusing).
          body = json.dumps({"email": "sync-gate@example.com"}).encode() if method == "POST" else None
          req = urllib.request.Request(
              "http://127.0.0.1:11235" + path, method=method,
              data=body,
              headers={"Content-Type": "application/json"},
          )
          try:
              got = urllib.request.urlopen(req, timeout=10).status
          except urllib.error.HTTPError as e:
              got = e.code
          except Exception as e:
              print(f"{method} {path} -> {type(e).__name__}")
              sys.exit(1)
          print(f"{method} {path} -> {got} (expected {want})")
          sys.exit(0 if got == want else 1)
          CHK
          }

          wait_ready() {
            for _ in $(seq 1 60); do
              if docker exec "$1" python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:11235/health", timeout=2).status==200 else 1)' 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            docker logs "$1" | tail -30
            return 1
          }

          # No credential configured: loopback bind, /token fails closed, MCP unreachable.
          cid="$(docker run -d --name sync-no-credential crawl4ai-sync:validate)"
          wait_ready "${cid}" || fail "container without credentials never became healthy"

          # Prove the helper itself can fail. A wrong expectation must exit non-zero, otherwise
          # every "expected X" below is decoration (this is exactly how a docker-exec gate
          # silently passes when stdin is not attached).
          if check "${cid}" /health GET 418 > /dev/null 2>&1; then
            fail "the container assertion helper cannot fail; the gate is not real"
          fi
          echo "container assertion helper verified: a wrong expectation fails"

          check "${cid}" /health GET 200 || fail "/health is not 200 without credentials"
          check "${cid}" /token POST 403 || fail "/token did not fail closed without credentials"
          check "${cid}" /mcp/sse GET 401 || fail "/mcp/sse is reachable without a credential"
          docker logs "${cid}" 2>&1 | grep -a "binding loopback only" > /dev/null             || fail "no-credential container did not report a loopback bind"
          docker rm -f "${cid}" > /dev/null

          # Credential configured: exposure allowed, MCP still gated.
          cid="$(docker run -d --name sync-with-token -e CRAWL4AI_API_TOKEN=sync-gate-token crawl4ai-sync:validate)"
          wait_ready "${cid}" || fail "container with a token never became healthy"
          check "${cid}" /mcp/sse GET 401 || fail "/mcp/sse is reachable without a credential when a token is configured"
          docker rm -f "${cid}" > /dev/null

      - name: Resolve tag and release state
        id: state
        if: steps.plan.outputs.build_needed == 'true'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"

          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "${remote_tag_sha}" ]; then
            tag_exists=true
            tag_sha="${remote_tag_sha}"
            # The tag is immutable. If the branch has moved on since it was created (a fork
            # commit, a workflow fix), that is not an error and not a reason to move it: the
            # tag names the commit that was validated in its own run, and publication is
            # about that commit, so publishing keeps using the tag's SHA.
            if [ "${remote_tag_sha}" = "${head_sha}" ]; then
              tag_matches=true
            else
              tag_matches=false
              echo "tag ${TAG} already exists at ${tag_sha}; HEAD is ${head_sha} — publishing the tag's commit, not HEAD."
            fi
          else
            tag_exists=false
            tag_matches=false
            tag_sha=""
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi

          if [ -n "${remote_tag_sha}" ]; then publish_sha="${remote_tag_sha}"; else publish_sha="${head_sha}"; fi

          {
            echo "head_sha=${head_sha}"
            echo "tag_sha=${tag_sha}"
            echo "publish_sha=${publish_sha}"
            echo "tag_exists=${tag_exists}"
            echo "tag_matches=${tag_matches}"
            echo "release_exists=${release_exists}"
          } >> "$GITHUB_OUTPUT"

      - name: Push the sync branch
        if: steps.detect.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          # No --force: a concurrent advance must fail the run, not be overwritten.
          git push origin "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Create the sync tag
        if: steps.state.outputs.tag_exists == 'false' && inputs.dry_run != true && steps.plan.outputs.build_needed == 'true'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${TAG}" "${{ steps.state.outputs.head_sha }}"
          git push origin "refs/tags/${TAG}"

      - name: Create the GitHub release
        if: steps.state.outputs.release_exists == 'false' && inputs.dry_run != true && steps.plan.outputs.build_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          target_commitish: ${{ steps.state.outputs.publish_sha }}
          name: Sync ${{ steps.detect.outputs.tag }}
          generate_release_notes: true
          body: |
            Automated upstream sync.

            - Upstream: `${{ env.UPSTREAM_REPO }}` (`${{ env.UPSTREAM_BRANCH }}`)
            - Upstream commit: `${{ steps.detect.outputs.upstream_sha }}`
            - Merge base before sync: `${{ steps.detect.outputs.merge_base }}`
            - Upstream commits merged: ${{ steps.detect.outputs.upstream_ahead_count }}
            - Synced commit (validated before push): `${{ steps.state.outputs.publish_sha }}`
          # github.token by design: this release must not fire the release-triggered
          # Docker workflow, which is dispatched explicitly below so it always builds
          # the commit this run validated.
          token: ${{ github.token }}

      - name: Publish and verify the Docker image for this tag
        if: inputs.dry_run != true && steps.plan.outputs.build_needed == 'true'
        env:
          # github.token on purpose: dispatching a workflow needs the actions:write
          # permission this workflow declares, and a classic PAT without the `workflow`
          # scope is rejected with HTTP 403 "Resource not accessible by personal access
          # token". workflow_dispatch is one of the two events GITHUB_TOKEN may trigger.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
          SHA: ${{ steps.state.outputs.publish_sha }}
        run: |
          set -euo pipefail

          # Verification is separate from pushing: an image that already exists (a retry, or a
          # publication that completed while this run was validating) must still be verified
          # against the commit this run validated, not silently accepted.
          verify_published() {
            docker pull --quiet "${IMAGE_NAME}:${TAG}" > /dev/null
            label_sha="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE_NAME}:${TAG}" 2>/dev/null || true)"
            pulled_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${TAG}" 2>/dev/null | sed 's/.*@//')"
            registry_digest="$(curl -s --max-time 20     "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${TAG}"     | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("digest") or ((d.get("images") or [{}])[0]).get("digest") or "")'       2>/dev/null || true)"
            echo "${IMAGE_NAME}:${TAG} label=${label_sha:-none} registry_digest=${registry_digest:-unknown} pulled_digest=${pulled_digest:-unknown}"
            if [ "${label_sha}" != "${SHA}" ]; then
              echo "::error::the published image is labelled ${label_sha:-none}, not the validated ${SHA}"
              return 1
            fi
            if [ -z "${registry_digest}" ] || [ "${registry_digest}" != "${pulled_digest}" ]; then
              echo "::error::the registry digest for ${IMAGE_NAME}:${TAG} does not match the pulled image"
              return 1
            fi
          }

          if [ "${{ steps.detect.outputs.image_exists }}" = "true" ]; then
            echo "${IMAGE_NAME}:${TAG} already exists (retry, or published during validation); verifying instead of pushing."
            verify_published
            echo "verified ${IMAGE_NAME}:${TAG} at ${SHA} (digest ${registry_digest})"
            exit 0
          fi

          # Publication is asynchronous: adopt an already queued/running run for this tag instead
          # of dispatching a second one, and never adopt a completed one — an old failed run must
          # not satisfy this attempt.
          run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow docker-release.yml   --limit 50 --json databaseId,status,displayTitle   --jq "[.[] | select(.displayTitle == \"docker ${TAG}\" and .status != \"completed\")][0].databaseId // empty")"

          if [ -n "${run_id}" ]; then
            echo "adopting in-flight publication run ${run_id} for ${TAG}"
          else
            before_ids="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow docker-release.yml     --limit 50 --json databaseId --jq '.[].databaseId' | tr '
          ' ' ')"
            if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
              echo "debug::PAT_TOKEN not set; dispatch uses github.token."
            fi
            gh workflow run docker-release.yml     --repo "${GITHUB_REPOSITORY}"     --ref "${SYNC_BRANCH}"     -f tag="${TAG}"     -f ref="${SHA}" \
              || { echo "::error::could not dispatch docker-release.yml. GITHUB_TOKEN needs actions:write; a PAT needs the workflow scope."; exit 1; }
            for _ in $(seq 1 40); do
              sleep 10
              candidate="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow docker-release.yml       --limit 50 --json databaseId,displayTitle       --jq "[.[] | select(.displayTitle == \"docker ${TAG}\")][0].databaseId // empty")"
              if [ -n "${candidate}" ] && ! printf ' %s ' "${before_ids}" | grep -q " ${candidate} "; then
                run_id="${candidate}"
                break
              fi
            done
            [ -n "${run_id}" ] || { echo "::error::the dispatch for ${TAG} produced no new run."; exit 1; }
            echo "dispatched publication run ${run_id} for ${TAG} (pre-existing ids excluded: ${before_ids:-none})"
          fi

          status=""
          for _ in $(seq 1 180); do
            status="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status,conclusion     --jq '"\(.status) \(.conclusion)"')"
            echo "${TAG} run ${run_id}: ${status}"
            case "${status}" in
              "completed success") break ;;
              completed*) echo "::error::docker-release run ${run_id} finished as ${status}"; exit 1 ;;
            esac
            sleep 30
          done
          [ "${status}" = "completed success" ]   || { echo "::error::docker-release run ${run_id} did not finish in time (${status})"; exit 1; }

          # Tie the published digest to the publisher this run selected, using the markers that
          # publisher printed, rather than comparing the tag against itself.
          publisher_log="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --log 2>/dev/null || true)"
          pub_revision="$(printf '%s
          ' "${publisher_log}" | grep -oE 'published-revision=[0-9a-f]{7,40}' | tail -1 | cut -d= -f2)"
          pub_digest="$(printf '%s
          ' "${publisher_log}" | grep -oE 'published-digest=sha256:[0-9a-f]+' | tail -1 | cut -d= -f2)"
          echo "publisher ${run_id} reported revision=${pub_revision:-none} digest=${pub_digest:-none}"
          if [ "${pub_revision}" != "${SHA}" ]; then
            echo "::error::the publisher built ${pub_revision:-nothing}, not the validated ${SHA}"
            exit 1
          fi

          verify_published
          if [ "${pub_digest}" != "${registry_digest}" ]; then
            echo "::error::publisher ${run_id} reported digest ${pub_digest:-none}, registry has ${registry_digest}"
            exit 1
          fi
          echo "published and verified ${IMAGE_NAME}:${TAG} at ${SHA} (digest ${registry_digest})"

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Upstream sync"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| branch | \`${SYNC_BRANCH}\` |"
            echo "| dry run | ${{ inputs.dry_run }} |"
            echo "| upstream head | \`${{ steps.detect.outputs.upstream_sha }}\` |"
            echo "| merge base | \`${{ steps.detect.outputs.merge_base }}\` |"
            echo "| upstream ahead | ${{ steps.detect.outputs.upstream_ahead_count }} |"
            echo "| changes | ${{ steps.detect.outputs.has_changes }} |"
            echo "| merge commit | \`${{ steps.state.outputs.head_sha }}\` |"
            echo "| published commit | \`${{ steps.state.outputs.publish_sha }}\` |"
            echo "| tag | \`${{ steps.detect.outputs.tag }}\` |"
            echo "| tag existed | ${{ steps.detect.outputs.tag_exists }} |"
            echo "| release existed | ${{ steps.detect.outputs.release_exists }} |"
            echo "| image existed | ${{ steps.detect.outputs.image_exists }} |"
            echo "| validation ran | ${{ steps.plan.outputs.build_needed }} |"
          } >> "$GITHUB_STEP_SUMMARY"
